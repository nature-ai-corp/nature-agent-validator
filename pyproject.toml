[build-system]
# setuptools >= 77 is required for standards-compliant PEP 639 license
# metadata (`license` as an SPDX expression + `license-files`). The build
# backend itself is unchanged.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nature-agent-validator"
# The version is sourced from a single authoritative constant:
# src/nature_agent_validator/__init__.py :: __version__  (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "Standalone, no-model-first framework for validating whether an AI agent behaved as expected."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "NATURE AI CORP" }]
keywords = ["agent", "validation", "testing", "assurance", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# Phase 0: zero runtime dependencies. The deterministic core runs on the
# Python standard library alone -- no LLM, no HTTP client, no evaluator model.
dependencies = []

[project.optional-dependencies]
# No third-party development dependencies are approved yet (OSS review pending).
# Tests run on the standard library:  python -m unittest discover -s tests -t .
dev = []

[project.scripts]
nav = "nature_agent_validator.cli.main:main"

[project.urls]
Homepage = "https://github.com/nature-ai-corp/nature-agent-validator"
Repository = "https://github.com/nature-ai-corp/nature-agent-validator"
Issues = "https://github.com/nature-ai-corp/nature-agent-validator/issues"

[tool.setuptools.dynamic]
version = { attr = "nature_agent_validator.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nature_agent_validator = ["py.typed"]
