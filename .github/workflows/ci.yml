# NATURE Agent Validator -- CI (Phases 7C-A + 7C-B).
#
# tests job:  Python 3.12 / 3.13 / 3.14 -- unit tests, installed
#             metadata/version proof, byte-compile.
# build job:  sdist + wheel build, distribution-metadata + license-file
#             checks, clean-room wheel install with CLI smoke, an SPDX JSON
#             SBOM for the installed NATURE distribution, and a SHA256SUMS
#             manifest -- each independently verified with the standard library.
#
# Release PREPARATION only: no artifact upload, no GitHub Release, no PyPI,
# no Git tag, no signing, no attestation, no external SBOM upload.
#
# Every third-party action is pinned to a full 40-character commit SHA
# (actions/checkout, actions/setup-python only). Extra tools installed in the
# build job are version-pinned and CI/release tooling only -- never project
# dependencies (see docs/release-tooling.md): PyPA build==1.6.0,
# sbom4python==0.12.6.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only, no secrets are used anywhere in this workflow.
permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        # A normal (non-editable) install so real distribution metadata exists.
        # Build-backend requirements (setuptools>=77) are resolved by pip's
        # build isolation from PyPI; the project itself has zero runtime deps.
        run: python -m pip install .

      - name: Run the unit test suite
        run: python -m unittest discover -s tests -t .

      - name: Prove the installed metadata/version test runs (not skipped)
        run: |
          python -m unittest -v \
            tests.test_package.PackageImportTests.test_distribution_metadata_matches_when_installed \
            2>&1 | tee metadata-version-test.log
          grep -q "Ran 1 test" metadata-version-test.log
          if grep -qi "skipped" metadata-version-test.log; then
            echo "::error::installed metadata/version consistency test was skipped; it must execute when the package is installed"
            exit 1
          fi
          tail -n 1 metadata-version-test.log | grep -qx "OK"

      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests

  build:
    name: build, wheel smoke, SBOM & checksums
    runs-on: ubuntu-latest
    # Independent of the test matrix on purpose: it rebuilds from a fresh
    # checkout rather than consuming matrix artifacts.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install PyPA build (pinned)
        run: python -m pip install "build==1.6.0"

      - name: Build sdist and wheel
        # The configured backend (setuptools.build_meta) is unchanged; `build`
        # provisions setuptools>=77 in an isolated environment per pyproject.
        run: python -m build

      - name: Check expected artifact filenames
        run: |
          ls -l dist
          test -f "dist/nature_agent_validator-0.1.0a1.tar.gz"
          test -f "dist/nature_agent_validator-0.1.0a1-py3-none-any.whl"

      - name: Verify distribution metadata and bundled license files
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile

          whl = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(whl)
          names = zf.namelist()
          meta_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
          meta = zf.read(meta_name).decode()
          print("--- wheel METADATA (head) ---")
          print("\n".join(meta.splitlines()[:20]))
          assert "Name: nature-agent-validator" in meta, "wheel: Name"
          assert "Version: 0.1.0a1" in meta, "wheel: Version"
          assert "License-Expression: Apache-2.0" in meta, "wheel: License-Expression"
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), "wheel: bundled LICENSE"
          assert any(n.endswith(".dist-info/licenses/NOTICE") for n in names), "wheel: bundled NOTICE"

          sdist = glob.glob("dist/*.tar.gz")[0]
          tf = tarfile.open(sdist)
          tnames = tf.getnames()
          assert any(n.endswith("/LICENSE") for n in tnames), "sdist: LICENSE"
          assert any(n.endswith("/NOTICE") for n in tnames), "sdist: NOTICE"
          pkg_name = next(n for n in tnames if n.endswith("/PKG-INFO"))
          pkg = tf.extractfile(pkg_name).read().decode()
          assert "Name: nature-agent-validator" in pkg, "sdist: Name"
          assert "Version: 0.1.0a1" in pkg, "sdist: Version"
          assert "License-Expression: Apache-2.0" in pkg, "sdist: License-Expression"
          print("distribution metadata and license files OK")
          PY

      - name: Clean-room install of the built wheel
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps \
            "dist/nature_agent_validator-0.1.0a1-py3-none-any.whl"

      - name: Installed-wheel smoke checks (run outside the source tree)
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/wheel-venv"
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          cd "$smoke"
          "$venv/bin/nav" --version | tee nav-version.txt
          grep -qx "nav 0.1.0a1" nav-version.txt
          "$venv/bin/nav" --help
          "$venv/bin/nav" scenario describe
          "$venv/bin/python" -c "import nature_agent_validator as n, importlib.metadata as m; assert n.__version__ == '0.1.0a1', n.__version__; assert m.version('nature-agent-validator') == '0.1.0a1', m.version('nature-agent-validator'); print('installed wheel import OK:', n.__version__)"

      - name: Install the SBOM generator (pinned; CI/release tooling only)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "sbom4python==0.12.6"
          echo "--- resolved SBOM-tooling closure in the clean-room venv (provenance record) ---"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip list --format=freeze

      - name: Generate the SPDX JSON SBOM for the installed NATURE distribution
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/wheel-venv"
          out="$GITHUB_WORKSPACE/dist/nature-agent-validator-0.1.0a1.spdx.json"
          # Run from outside the source tree. Module mode -> only the target
          # distribution and its (empty) runtime dependency closure; the SBOM
          # tool and its own deps must NOT appear (asserted in the next step).
          cd "$RUNNER_TEMP"
          "$venv/bin/sbom4python" \
            --module nature_agent_validator \
            --sbom spdx \
            --format json \
            --output-file "$out"
          test -s "$out"

      - name: Validate the SBOM (stdlib only; do not trust the generator exit code)
        run: |
          python - <<'PY'
          import json, os

          path = "dist/nature-agent-validator-0.1.0a1.spdx.json"
          assert os.path.isfile(path), "SBOM file was not created"
          assert os.path.getsize(path) > 0, "SBOM file is empty"
          with open(path, encoding="utf-8") as fh:
              doc = json.load(fh)  # raises if the file is not valid JSON

          spdx_version = doc.get("spdxVersion")
          assert spdx_version in {"SPDX-2.2", "SPDX-2.3"}, f"unexpected spdxVersion: {spdx_version!r}"
          assert doc.get("SPDXID") == "SPDXRef-DOCUMENT", f"SPDXID: {doc.get('SPDXID')!r}"
          assert doc.get("dataLicense"), "SBOM has no dataLicense"
          assert doc.get("name"), "SBOM document has no name"

          packages = doc.get("packages") or []
          assert packages, "SBOM contains no packages"

          def norm(value):
              return (value or "").strip().lower().replace("_", "-")

          names = sorted(norm(p.get("name")) for p in packages)

          # Strict positive allowlist -- NOT a denylist. NATURE Agent Validator
          # has zero runtime dependencies, so the product SBOM must describe
          # ONLY the NATURE distribution. Any other package -- CI/build/SBOM
          # tooling, an interpreter/platform entry, or anything unforeseen --
          # fails this job and forces a human to inspect the SBOM before this
          # set is widened. The generated SBOM is never filtered, edited, or
          # sanitised: generator -> inspect -> fail closed.
          ALLOWED_PACKAGE_NAMES = frozenset({"nature-agent-validator"})

          unexpected = sorted(set(names) - ALLOWED_PACKAGE_NAMES)
          assert not unexpected, (
              f"SBOM contains package(s) outside the allowlist "
              f"{sorted(ALLOWED_PACKAGE_NAMES)}: {unexpected}. The product SBOM must "
              "describe only the NATURE distribution (zero runtime dependencies). "
              "Do not filter the SBOM -- investigate why the generator emitted these "
              "and, only if legitimate, add the exact name to ALLOWED_PACKAGE_NAMES "
              "after review."
          )

          # NATURE identity within the (now allowlist-clean) SBOM.
          assert "nature-agent-validator" in set(names), f"NATURE package absent; packages={names}"
          nav = next(p for p in packages if norm(p.get("name")) == "nature-agent-validator")
          assert nav.get("versionInfo") == "0.1.0a1", f"NATURE versionInfo={nav.get('versionInfo')!r}"

          print(f"SBOM OK: spdxVersion={spdx_version}, packages={names}")
          PY

      - name: Generate dist/SHA256SUMS
        run: |
          python - <<'PY'
          import hashlib, pathlib

          dist = pathlib.Path("dist")
          # Exactly the intended release-preparation artifacts, lexical order.
          artifacts = sorted([
              "nature-agent-validator-0.1.0a1.spdx.json",
              "nature_agent_validator-0.1.0a1-py3-none-any.whl",
              "nature_agent_validator-0.1.0a1.tar.gz",
          ])
          lines = []
          for name in artifacts:
              data = (dist / name).read_bytes()
              assert data, f"refusing to hash an empty artifact: {name}"
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {name}")
          (dist / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Verify dist/SHA256SUMS independently
        run: |
          python - <<'PY'
          import hashlib, pathlib, re

          dist = pathlib.Path("dist")
          sums = dist / "SHA256SUMS"
          assert sums.is_file(), "SHA256SUMS is missing"

          expected = {
              "nature-agent-validator-0.1.0a1.spdx.json",
              "nature_agent_validator-0.1.0a1-py3-none-any.whl",
              "nature_agent_validator-0.1.0a1.tar.gz",
          }
          line_re = re.compile(r"^([0-9a-f]{64})  (\S.*)$")
          seen = []
          for i, raw in enumerate(sums.read_text(encoding="utf-8").splitlines(), 1):
              if not raw:
                  continue
              m = line_re.match(raw)
              assert m, f"malformed SHA256SUMS line {i}: {raw!r}"
              digest, name = m.group(1), m.group(2)
              assert name != "SHA256SUMS", "SHA256SUMS must not hash itself"
              assert name in expected, f"unexpected artifact listed in SHA256SUMS: {name}"
              assert name not in seen, f"duplicate entry in SHA256SUMS: {name}"
              target = dist / name
              assert target.is_file(), f"artifact listed in SHA256SUMS is missing: {name}"
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              assert actual == digest, f"SHA-256 mismatch for {name}"
              seen.append(name)
          missing = expected - set(seen)
          assert not missing, f"expected artifact(s) omitted from SHA256SUMS: {sorted(missing)}"
          assert seen == sorted(seen), f"SHA256SUMS is not in lexical order: {seen}"
          print("SHA256SUMS verified (lexical order):")
          print(sums.read_text(encoding="utf-8").rstrip())
          PY
