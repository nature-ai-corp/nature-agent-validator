# NATURE Agent Validator -- CI foundation (Phase 7C-A).
#
# Scope: proves the package on Python 3.12 / 3.13 / 3.14 -- unit tests,
# byte-compile, normal install, installed metadata/version consistency,
# sdist + wheel build, and a clean-room install of the built wheel with CLI
# smoke checks. This workflow does NOT publish anything: no artifact upload,
# no GitHub Release, no PyPI, no tags, no SBOM/provenance/attestation.
#
# Every third-party action is pinned to a full 40-character commit SHA. Only
# actions/checkout and actions/setup-python are used. The only extra CI tool
# installed is PyPA `build` (pinned exact version), in the build job only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only, no secrets are used anywhere in this workflow.
permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        # A normal (non-editable) install so real distribution metadata exists.
        # Build-backend requirements (setuptools>=77) are resolved by pip's
        # build isolation from PyPI; the project itself has zero runtime deps.
        run: python -m pip install .

      - name: Run the unit test suite
        run: python -m unittest discover -s tests -t .

      - name: Prove the installed metadata/version test runs (not skipped)
        run: |
          python -m unittest -v \
            tests.test_package.PackageImportTests.test_distribution_metadata_matches_when_installed \
            2>&1 | tee metadata-version-test.log
          grep -q "Ran 1 test" metadata-version-test.log
          if grep -qi "skipped" metadata-version-test.log; then
            echo "::error::installed metadata/version consistency test was skipped; it must execute when the package is installed"
            exit 1
          fi
          tail -n 1 metadata-version-test.log | grep -qx "OK"

      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests

  build:
    name: build & clean-room wheel smoke
    runs-on: ubuntu-latest
    # Independent of the test matrix on purpose: it rebuilds from a fresh
    # checkout rather than consuming matrix artifacts.
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install PyPA build (pinned)
        run: python -m pip install "build==1.6.0"

      - name: Build sdist and wheel
        # The configured backend (setuptools.build_meta) is unchanged; `build`
        # provisions setuptools>=77 in an isolated environment per pyproject.
        run: python -m build

      - name: Check expected artifact filenames
        run: |
          ls -l dist
          test -f "dist/nature_agent_validator-0.1.0a1.tar.gz"
          test -f "dist/nature_agent_validator-0.1.0a1-py3-none-any.whl"

      - name: Verify distribution metadata and bundled license files
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile

          whl = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(whl)
          names = zf.namelist()
          meta_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
          meta = zf.read(meta_name).decode()
          print("--- wheel METADATA (head) ---")
          print("\n".join(meta.splitlines()[:20]))
          assert "Name: nature-agent-validator" in meta, "wheel: Name"
          assert "Version: 0.1.0a1" in meta, "wheel: Version"
          assert "License-Expression: Apache-2.0" in meta, "wheel: License-Expression"
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), "wheel: bundled LICENSE"
          assert any(n.endswith(".dist-info/licenses/NOTICE") for n in names), "wheel: bundled NOTICE"

          sdist = glob.glob("dist/*.tar.gz")[0]
          tf = tarfile.open(sdist)
          tnames = tf.getnames()
          assert any(n.endswith("/LICENSE") for n in tnames), "sdist: LICENSE"
          assert any(n.endswith("/NOTICE") for n in tnames), "sdist: NOTICE"
          pkg_name = next(n for n in tnames if n.endswith("/PKG-INFO"))
          pkg = tf.extractfile(pkg_name).read().decode()
          assert "Name: nature-agent-validator" in pkg, "sdist: Name"
          assert "Version: 0.1.0a1" in pkg, "sdist: Version"
          assert "License-Expression: Apache-2.0" in pkg, "sdist: License-Expression"
          print("distribution metadata and license files OK")
          PY

      - name: Clean-room install of the built wheel
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps \
            "dist/nature_agent_validator-0.1.0a1-py3-none-any.whl"

      - name: Installed-wheel smoke checks (run outside the source tree)
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/wheel-venv"
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          cd "$smoke"
          "$venv/bin/nav" --version | tee nav-version.txt
          grep -qx "nav 0.1.0a1" nav-version.txt
          "$venv/bin/nav" --help
          "$venv/bin/nav" scenario describe
          "$venv/bin/python" -c "import nature_agent_validator as n, importlib.metadata as m; assert n.__version__ == '0.1.0a1', n.__version__; assert m.version('nature-agent-validator') == '0.1.0a1', m.version('nature-agent-validator'); print('installed wheel import OK:', n.__version__)"
