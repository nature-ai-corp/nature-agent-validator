# Blank issues stay available -- the three templates cover the common cases,
# but nothing forces every issue into one of them.
#
# No custom security contact_link here: GitHub's native Private Vulnerability
# Reporting entry already appears in the issue-type picker and is the
# authoritative security path (see SECURITY.md) -- a custom contact_links
# entry pointing at the same place only duplicated it.
blank_issues_enabled: true
